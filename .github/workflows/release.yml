name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install fyne-cross
        run: go install github.com/fyne-io/fyne-cross@latest

      - name: Build Linux
        run: make build-linux

      - name: Build Windows
        run: make build-windows

      - name: Flatten dist
        run: |
          mkdir -p dist
          mv "fyne-cross/dist/linux-amd64/Supernote Toolkit.tar.xz" dist/linux-amd64.tar.xz
          mv "fyne-cross/dist/linux-arm64/Supernote Toolkit.tar.xz" dist/linux-arm64.tar.xz
          mv "fyne-cross/dist/linux-arm/Supernote Toolkit.tar.xz" dist/linux-arm.tar.xz
          mv "fyne-cross/dist/windows-amd64/Supernote Toolkit.exe.zip" dist/windows-amd64.exe.zip
          mv "fyne-cross/dist/windows-arm64/Supernote Toolkit.exe.zip" dist/windows-arm64.exe.zip

      - uses: actions/upload-artifact@v6
        with:
          name: linux-windows-binaries
          path: dist/*

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install fyne CLI
        run: go install fyne.io/fyne/v2/cmd/fyne@latest

      - name: Build macOS
        run: make build-macos

      - name: Flatten dist
        run: |
          mkdir -p dist
          mv "fyne-cross/dist/darwin-arm64/Supernote Toolkit.dmg" dist/darwin-arm64.dmg

      - uses: actions/upload-artifact@v6
        with:
          name: macos-binaries
          path: dist/*

  release:
    runs-on: ubuntu-latest
    needs: [build-linux-windows, build-macos]
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > checksum.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
